name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Find Gradle project
    run: |
      ls -la
      find . -maxdepth 3 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

  - name: Build APK
    run: |
      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug
      elif [ -f ./app/gradlew ]; then
        cd app
        chmod +x ./gradlew
        ./gradlew assembleDebug
      else
        echo "Gradle project or gradlew not found"
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MindYar-AI-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
